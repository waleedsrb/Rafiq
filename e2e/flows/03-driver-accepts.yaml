# Dana opens the app and answers from the Home card: she accepts Amir and declines Sara.
# Sara asks while Dana is looking (sql/hooks/sara-requests.sql), so this also proves Home
# updates live, without a refresh (src/lib/live.ts). Each answer waits 5 seconds for Undo,
# then goes to the database (src/components/hero-actions.tsx).
appId: app.rafiq
name: Driver accepts one request and declines another, from Home
tags: [ride]
---
- runFlow:
    file: common/sign-in.yaml
    env:
      EMAIL: e2e-driver@rafiq.test
- extendedWaitUntil:
    visible: "New request · .*"
    timeout: 20000
- assertVisible: ".*Amir S\\..*"
# Sara asks now. The caption turns into "2 requests" on its own (the number is wrapped in
# invisible left-to-right marks, hence the .* around it).
- runScript:
    file: ../scripts/hook.js
    env:
      HOOK: sara-requests
- extendedWaitUntil:
    visible: ".*2.* requests · .*"
    timeout: 30000
- tapOn:
    id: "hero-accept"
- assertVisible: ".*Accepted Amir.*"
- extendedWaitUntil:
    notVisible: "Undo.*"
    timeout: 20000
# Sara's request moves up. Decline asks first.
- extendedWaitUntil:
    visible: ".*Sara O\\..*"
    timeout: 20000
- tapOn: "Decline Sara"
- extendedWaitUntil:
    visible: "Decline Sara\\?"
    timeout: 10000
- tapOn: "Decline"
- extendedWaitUntil:
    notVisible: "Undo.*"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "New request · .*"
    timeout: 20000
- takeScreenshot: 03-requests-answered
