name: End-to-end

# Builds the real Android app, starts a throwaway Supabase from supabase/migrations, and
# taps through the ride loop with Maestro on an Android emulator (e2e/README.md).
# Slow (about 30 minutes), so it runs only when something the app or database is made of
# changes, plus every night and on demand from the Actions tab.
#
# Design-only pull requests can skip it: add the label "design" to the PR (before or after
# opening it). The full run still happens after the merge to main and every night, so a
# design change that breaks a flow is caught within a day.
on:
  pull_request:
    # labeled/unlabeled: adding "design" cancels a run already going; removing it runs again.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '0 1 * * *' # every night, 03:00 in Ramallah
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Ride loop on Android
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'design') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The emulator reaches the CI machine at 10.0.2.2.
      EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
      # Marks the build as the test build: crash reports stay off (src/lib/crash-config.ts).
      EXPO_PUBLIC_BUILD: e2e
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      # ── The database: every migration, then the test people ──────────────────────
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start a local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta
      - name: Hand the app its local keys
        run: |
          eval "$(supabase status -o env)"
          key=${ANON_KEY:-${PUBLISHABLE_KEY:-}}
          test -n "$key" || { supabase status -o env | cut -d= -f1; echo "no anon key"; exit 1; }
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"

      # ── The app: a release APK, built here with Gradle (no EAS minutes) ─────────
      - name: Prepare the test build
        run: |
          node e2e/scripts/prepare-android.mjs
          npx expo prebuild --platform android --no-install
          bash e2e/scripts/allow-local-http.sh
      - name: Build the APK
        working-directory: android
        # x86_64 only: that is what the emulator runs, and it builds four times faster.
        # Gradle downloads its plugins from the internet; a failed download once broke the
        # build before it began (Nov 12), so a failed build gets one more try.
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon ||
            { echo "Build failed, trying once more"; sleep 30; ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon; }

      # ── The phone: an emulator, Maestro, and the flows ──────────────────────────
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: adb install -r android/app/build/outputs/apk/release/app-release.apk && bash e2e/run.sh

      - name: Keep screenshots and logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            e2e/output/
            e2e/**/*.png
          if-no-files-found: ignore
          retention-days: 14
