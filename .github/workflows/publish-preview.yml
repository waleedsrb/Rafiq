# Every merge to main publishes the app to the EAS Update "preview" branch,
# so it shows up in Expo Go (Rafiq -> Branches -> preview) a few minutes later.
#
# This runs on GitHub's free minutes (unlimited for public repos). It replaces the
# EAS Workflow in .eas/workflows, whose free plan ran out of build minutes (Nov 9).
# Needs one repository secret: EXPO_TOKEN (an Expo access token for the waleedsrb account).
name: Publish preview

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-preview
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish update
        env:
          EXPO_PUBLIC_BUILD: ${{ github.sha }}
          # Public client values (they ship inside the app anyway). Never put secret keys here.
          EXPO_PUBLIC_SUPABASE_URL: https://pomyvelsxfzvplkzjlou.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvbXl2ZWxzeGZ6dnBsa3pqbG91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMzY4OTYsImV4cCI6MjEwOTYxMjg5Nn0.W9mAoQI73fwTIusBKIKOZDtxKxiqGBZvAaaYzZOoh3M
        run: eas update --branch preview --platform all --non-interactive --message "$(git log -1 --pretty=%s)"
