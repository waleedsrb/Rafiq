# Publishes the admin website (admin/) to GitHub Pages on every push to main.
# Address: https://waleedsrb.github.io/Rafiq/
#
# The two values below are public on purpose: the URL and the publishable (anon) key are
# also inside the app. The database's rules decide what they can do, not secrecy.
name: Admin website

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/admin-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: admin
    env:
      VITE_SUPABASE_URL: https://pomyvelsxfzvplkzjlou.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_1BWN02gOnCoqyzNJLtImDQ_fYC27tpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist
      - id: deployment
        uses: actions/deploy-pages@v4
